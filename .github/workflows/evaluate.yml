name: capture evaluation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust evaluation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      CGO_ENABLED: "0"
      TRACEHOUND_TEST_SENSOR: ${{ github.workspace }}/tracehound-test${{ matrix.os == 'windows-latest' && '.exe' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check Rust formatting
        run: cargo fmt --manifest-path tools/capture-eval/Cargo.toml --all -- --check

      - name: Lint Rust targets
        run: cargo clippy --locked --manifest-path tools/capture-eval/Cargo.toml --all-targets -- -D warnings

      # Integration tests create independent packet fixtures and invoke the
      # actual sensor against them, including user-supplied suite paths.
      - name: Build sensor for capture integration tests
        run: go build -trimpath -o "${{ env.TRACEHOUND_TEST_SENSOR }}" ./cmd/tracehound

      - name: Test Rust library and CLI
        run: cargo test --locked --manifest-path tools/capture-eval/Cargo.toml --all-targets
