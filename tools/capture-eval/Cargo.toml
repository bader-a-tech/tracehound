[package]
name = "tracehound-eval"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Analyse real captures and evaluate Tracehound findings against labelled expectations"
publish = false

[features]
default = []
gui = ["dep:eframe"]

[[bin]]
name = "tracehound-desktop"
path = "src/bin/tracehound-desktop.rs"
required-features = ["gui"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ctrlc = { version = "3.5", features = ["termination"] }
eframe = { version = "0.37", optional = true, default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
